<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="CSS/SwiperSource.css"/>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

@font-face {
font-family: "Brittany";
src:url("Photos/BrittanySignature.ttf") format("truetype");
font-weight:normal;
font-style:normal;}

* {
margin:0;
padding:0;
box-sizing:border-box;}

body {
display:flex;
align-items:center;
justify-content:center;
width:100vw;
height:100vh;
overflow:hidden;
transition:0.3s;}

:root {
--i1:100vw;
--i2:360px;
--i3:1200px;}

.Wrapper {
position:absolute;
width:330px;
height:330px;
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:rgba(255,235,214,0.6);
background-image:url(Photos/Album.png);
background-blend-mode:lighten;
background-size:cover;
background-position:center;}

.Container {
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
gap:30px;
align-items:center;
justify-content:center;
transform:scale(0.7);
pointer-events:none;}

.swiper {
position:relative;
width:100%;
height:80%;
display:flex;
align-items:center;
justify-content:center;}

.swiper-wrapper {
width:100%;
height:260px;
padding:calc(50px + 50px*(var(--i1) - var(--i2))/var(--i3)) 0;
display:flex;
align-items:center;
list-style:none;}

.swiper-slide {
user-select:none;
width:calc(250px + 150px*(var(--i1) - var(--i2))/var(--i3));
height:calc(260px + 140px*(var(--i1) - var(--i2))/var(--i3));
overflow:hidden;
text-align:left;
background:white;
border-radius:calc(5px + 5px*(var(--i1) - var(--i2))/var(--i3));
box-shadow:0 0 10px rgba(0, 0, 0, 0.25);}

.image {
position:absolute;
width:100%;
height:100%;
padding:calc(10px + 10px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 10px*(var(--i1) - var(--i2))/var(--i3)) calc(50px + 20px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 10px*(var(--i1) - var(--i2))/var(--i3));
object-fit:cover;}

h1 {
position:absolute;
bottom:15px;
left:10px;
font-size:1rem;
font-weight:500;
color:#522B00;
font-family: "Brittany";}

h2 {
position:absolute;
bottom:10px;
right:10px;
font-size:0.5rem;
font-weight:500;
color:#CACACA;}

.Button {
position:relative;
display:flex;
align-items:center;
gap:15px;}

.Button .decoration {
position:relative;
width:40px;
height:auto;
filter:drop-shadow(0 1px 1px rgba(0,0,0,0.3));}

.Button button {
position:relative;
display:flex;
align-items:center;
gap:10px;
transition:0.3s;
padding:10px 20px;
border-radius:30px;
background:#F1DCC7;
border:1px solid rgba(255,255,255,0.5);
box-shadow:0 4px 10px rgba(77,41,0,0.3);}

.Button span {
position:relative;
font-size:0.7rem;
font-weight:600;
color:#7F4300;}

</style>

</head>

<body>

<div class="Wrapper">

<div class="Container">

<section class="swiper mySwiper">

<ul class="swiper-wrapper"></ul>

</section>

<section class="Button">

<img class="decoration" src="Photos/branch1.svg">

<button>
<img class="icon" src="Photos/image.svg">
<span>Open Album</span>
</button>

<img class="decoration" src="Photos/branch2.svg">

</section>

</div>

</div>

<script src="JS/SwiperSource.js"></script>

<script src="JS/Photos.js"></script>

</body>

</html>
