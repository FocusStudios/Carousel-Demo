<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Carousel</title>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

* {
margin:0;
padding:0;
transition:0.4s;
box-sizing:border-box;
font-family:Sans-serif;}

body {
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;}

.main-container {
position:absolute;
width:330px;
height:330px;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
pointer-events:none;
background-image:url(Devices/background.png);
background-size:cover;
background-position:center;}

.container {
position:absolute;
display:flex;
justify-content:center;
align-items:center;
transform:scale(0.4);}

.slider {
position:relative;
width:280px;
height:450px;
list-style:none;
pointer-events:none;
transform-style:preserve-3d;}

.slider .slide {
position:absolute;
width:100%;
height:100%;
transform-origin:center;
transform-style:preserve-3d;
transform:rotateY(calc(var(--i)*30deg)) translateZ(600px);}

.slider .slide .card {
position:absolute;
width:100%;
height:100%;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:var(--gradient);
box-shadow:0 0 20px var(--shadow);}

.slider .slide:nth-child(1) .card, .slider .slide:nth-child(5) .card, .slider .slide:nth-child(9) .card {
--border:rgba(0,102,255,0.8);
--Shadow:rgba(0,102,255,0.5);
--shadow:rgba(0,102,255,0.8);
--button:linear-gradient(to right, #45A5FE, #0066FF);
--gradient:linear-gradient(to bottom right, #0066FF 30%, #42BEFF 50% ,#0066FF 70%);}

.slider .slide:nth-child(2) .card, .slider .slide:nth-child(6) .card, .slider .slide:nth-child(10) .card {
--border:rgba(155,40,238,0.8);
--Shadow:rgba(155,40,238,0.5);
--shadow:rgba(155,40,238,0.8);
--button:linear-gradient(to right, #BC4AFD,#7626EF);
--gradient:linear-gradient(to bottom right, #9B28EE 30%, #CD94FF 50%,#9B28EE 70%);}

.slider .slide:nth-child(3) .card, .slider .slide:nth-child(7) .card, .slider .slide:nth-child(11) .card {
--border:rgba(0,63,255,0.8);
--Shadow:rgba(0,63,255,0.7);
--shadow:rgba(0,63,255,0.7);
--button:linear-gradient(to right, #335CFF, #0026BD);
--gradient:linear-gradient(to bottom right, #0026BD 30%, #6180FF 50%, #0026BD 70%);}

.slider .slide:nth-child(4) .card, .slider .slide:nth-child(8) .card, .slider .slide:nth-child(12) .card {
--border:rgba(95,0,255,0.8);
--Shadow:rgba(95,0,255,0.7);
--shadow:rgba(95,0,255,0.7);
--button:linear-gradient(to right, #9D33FF,#5F00FF);
--gradient:linear-gradient(to bottom right, #5F00FF 30%, #B58AFF 50%, #5F00FF 70%);}

.slider .slide.active .card {
transform:scale(1.15);}

.slide .image {
position:absolute;
width:calc(100% - 2px);
height:calc(100% - 2px);
border-radius:14px;
object-fit:cover;}

.badge {
position:absolute;
top:20px;
left:20px;
padding:6px 8px;
border-radius:5px;
display:flex;
align-items:center;
justify-content:center;
gap:5px;
outline:0.8px solid var(--shadow);
box-shadow:0 0 20px var(--Shadow);
background:linear-gradient(to right, transparent, var(--shadow));}

.badge .icon {
position:relative;
width:12px;
height:12px;}

.badge span {
position:relative;
color:#fff;
font-size:0.5rem;
font-weight:600;}

.like {
position:absolute;
top:10px;
right:10px;
fill:none;
stroke:#fff;
transition:0.3s;}

footer {
position:absolute;
bottom:0;
width:100%;
padding:20px;
display:flex;
flex-direction:column;
gap:8px;}

footer .details {
position:relative;
display:flex;
flex-direction:column;
gap:4px;}

.details h1 {
position:relative;
color:#fff;
font-size:1.1rem;
font-weight:1000;}

.details h2 {
position:relative;
color:#CEC7FF;
font-size:0.6rem;
font-weight:400;}

.features {
position:relative;
display:flex;
flex-direction:column;
gap:5px;}

.features .line {
position:relative;
width:100%;
height:0.1px;
opacity:0.2;
border-radius:1px;
background:#fff;}

.features ul {
position:relative;
padding:5px 15px;
list-style:none;
display:flex;
align-items:center;
justify-content:center;
gap:20px;}

.features ul li {
position:relative;
display:flex;
align-items:center;
gap:8px;}

.vline {
position:absolute;
height:100%;
width:0.1px;
opacity:0.2;
border-radius:1px;
background:#fff;}

.vline:nth-child(1) {
left:-10px;}

.vline:nth-child(2) {
right:-10px;}

.features ul li .icon {
position:relative;
width:15px;
height:15px;}

.features ul li span {
position:relative;
color:#fff;
font-size:0.4rem;
font-weight:400;
width:10%;}

footer .price {
position:relative;
display:flex;
padding-top:5px;}

footer .price h3 {
position:relative;
color:#fff;
font-size:1.1rem;
font-weight:1000;}

footer .price button {
position:relative;
margin-left:auto;
padding:8px 10px;
border-radius:5px;
display:flex;
align-items:center;
justify-content:center;
gap:5px;
border:none;
transition:0.3s;
background:var(--button);
box-shadow:0 0 10px var(--shadow);}

footer .price button span {
position:relative;
color:#fff;
font-size:0.5rem;
font-weight:700;}

footer .price button .icon {
position:relative;
width:10px;
height:10px;}

@keyframes Rotate {
0%{transform:perspective(4000px) rotateY(0deg);}
100%{transform:perspective(4000px) rotateY(360deg);}}

</style>

</head>

<body>

<div class="main-container">

<div class="container">

<ul class="slider"></ul>

</div>

</div>

<script src="JS/Rotating.js"></script>

</body>

</html>
