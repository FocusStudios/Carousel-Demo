<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Slides - Style 3</title>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

* {
margin:0;
padding:0;
transition:0.3s;
user-select:none;
box-sizing:border-box;
font-family: "Cormorant Garamond", serif;}

body {
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.container {
position:absolute;
width:330px;
height:330px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
overflow:hidden;
background:#FCDFC0;}

.background {
position:absolute;
width:auto;
height:330px;
object-fit:cover;}

.wrapper {
position:relative;
width:800px;
height:400px;
display:flex;
justify-content:center;
align-items:center;
pointer-events:none;
transform:scale(0.5);
transition:0.4s cubic-bezier(0.5,0,0.5,1);}

.carousel {
position:relative;
padding:10px 10px 50px 10px;
display:flex;
align-items:end;
justify-content:center;
gap:10px;
flex-wrap:nowrap;
list-style:none;}

.wrapper::-webkit-scrollbar, .carousel::-webkit-scrollbar {
display:none;}

.card {
position:relative;
width:60px;
height:200px;
border-radius:8px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;
cursor:pointer;
box-shadow:0 3px 8px rgba(100,35,0,0.6);
transition:0.4s cubic-bezier(0.5,0,0.5,1);
background:linear-gradient(var(--i) 60%, #000 100%);}

.card:nth-child(2), .card:nth-child(4) {
height:250px;}

.card:nth-child(3) {
height:300px;}

.card .details-container {
position:absolute;
width:calc(100% - 10px);
height:calc(100% - 10px);
display:flex;
align-items:center;
justify-content:center;
border-radius:4px;
outline:0.5px solid rgba(255,255,255,0.3);}

.card .book {
position:absolute;
left:0;
width:140px;
height:180px;
object-fit:cover;
opacity:0;
transform:translateY(20px);
filter:drop-shadow(-1px 1px 4px rgba(255,255,255,0.3));}

.card .details {
position:absolute;
right:0;
width:150px;
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:10px;
opacity:0;}

.card h1 {
position:absolute;
top:70px;
height:calc(100% - 90px);
opacity:1;
color:#FDEABC;
font-weight:600;
font-size:0.85rem;
letter-spacing:5px;
transition:0.4s;
width:100%;
display:flex;
align-items:center;
justify-content:center;
align-self:start;
writing-mode:vertical-lr;
text-orientation:upright;
text-shadow:0 1px 2px rgba(0,0,0,0.7);}

.card .line {
position:relative;
width:30%;
height:0.5px;
display:flex;
align-self:start;
border-radius:1px;
background:#FDEABC;
box-shadow:0 1px 2px rgba(0,0,0,0.5);}

.card h2, .card h3 {
position:relative;
color:#FDEABC;
display:flex;
align-self:start;
font-weight:500;
font-size:0.9rem;
text-shadow:2px 2px 2px rgba(0,0,0,0.5);}

.card h3 {
font-size:0.7rem;}

.card p {
position:relative;
width:75%;
display:flex;
align-self:start;
color:#FDEABC;
font-size:0.6rem;
line-height:15px;}

.card .button-container {
position:relative;
display:flex;
align-items:center;
justify-content:center;
align-self:start;
margin-top:10px;
opacity:0;
transform:translateY(10px);}

.card button {
position:relative;
padding:5px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
background:none;
pointer-events:auto;
cursor:pointer;
transition:0.3s;
border:1px solid rgba(253,234,188,0.5);}

.card button span {
position:relative;
color:#FDEABC;
font-weight:300;
font-size:0.6rem;
padding-left:10px;}

.card button .arrow {
position:relative;
width:15px;
height:15px;
border-radius:50%;
background:rgba(255,255,255,0.1);}

.card .icon {
position:absolute;
top:20px;
width:30px;
height:30px;
opacity:1;
border-radius:50%;
background:rgba(255,255,255,0.05);}

.card .decoration {
position:absolute;
width:auto;
height:6px;
opacity:1;}

.card .a {
top:2px;
background:var(--i);}

.card .b {
bottom:2px;
background:#000;}

.card.active {
width:300px;
cursor:default;}

.card.active h1, .card.active .icon {
opacity:0;}

.card.active .book {
opacity:1;
transform:translateY(0);
transition:0.5s 0.3s;}

.card.active .details {
opacity:1;
transition:0.4s 0.5s;}

.card.active .button-container {
opacity:1;
transform:translateY(0);
transition:0.5s 0.7s;;}

.card button:active {
transform:scale(0.85);}

</style>

</head>

<body>

<section class="container">

<img class="background" src="Books/background.png">

<div class="wrapper">

<ul class="carousel"></ul>

</div>

</section>

<script src="JS/Slides4.js"></script>

</body>

</html>
