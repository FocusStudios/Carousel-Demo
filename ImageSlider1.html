<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Slider 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, sans-serif;
user-select:none;}

body {
width:100vw;
height:100vh;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
transition:0.4s;}

:root {
--color1:#7226FF;
--color2:#4326FF;
--Background:#12002F;
--Shadow:rgba(139,76,255,0.6);}

.wrapper {
position:absolute;
width:330px;
height:330px;
--height:330px;
border-radius:20px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
pointer-events:none;
background:var(--Background);}

.Layer {
position:absolute;
width:100%;
height:100%;
background:#000;
mask-image:linear-gradient(to bottom right, transparent, black);
-webkit-mask-image:linear-gradient(to bottom right, transparent, black);}

svg {
position:absolute;
width:80px;
height:80px;}

svg * {
transition:0.4s;}

path {
fill:none;
stroke-width:3;
stroke-linecap:round;
stroke-linejoin:round;
transform-origin:center;
animation:Rotate 100s linear infinite;}

.stroke {
stroke-dasharray:800 800;
stroke:var(--color1);
opacity:0.2;}

.glow {
stroke-dasharray:0 800;
animation:Rotate 100s linear infinite, expandShrink 5s cubic-bezier(0.5,0,0.3,1) infinite, Show 5s infinite;}

.A {
transform:translate(-150px,-150px) scale(1);}

.B {
transform:translate(-140px,-90px) scale(0.7);}

.C {
transform:translate(150px,150px) scale(1);}

.D {
transform:translate(140px,90px) scale(0.7);}

.E {
transform:translate(140px,-140px) scale(1.2);}

.F {
transform:translate(-140px,140px) rotate(180deg) scale(1.2);}

@keyframes expandShrink {
0% {stroke-dasharray:0 800;stroke-dashoffset:0;}
50% {stroke-dasharray:800 0;stroke-dashoffset:0;}
100% {stroke-dasharray:0 800;stroke-dashoffset:-800;}}

@keyframes Show {
0% {display:flex;}
84% {display:none;}
100% {display:none;}}

@keyframes Rotate {
from {transform:rotate(0deg);}
to {transform:rotate(360deg);}}

.container {
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
z-index:1;
transform:scale(0.7);}

.slider {
position:absolute;
top:25px;
width:300px;
height:220px;
border-radius:10px;
list-style:none;
transition:0.4s;
box-shadow:0 0 10px var(--Shadow);}

.slide {
position:absolute;
top:235px;
width:70px;
height:70px;
border-radius:10px;
overflow:hidden;
display:flex;
align-items:center;
transition:0.4s;
background-image:var(--img);
background-size:cover;
background-position:center;}

.slide:nth-child(1), .slide:nth-child(2)  {
position:absolute;
top:0;
width:100%;
height:100%;}

.slide:nth-child(n+3) {
box-shadow:0 2px 10px var(--Shadow);}

.slide:nth-child(3) {
left:0;
opacity:1;
cursor:pointer;}

.slide:nth-child(4) {
left:85px;
opacity:0.5;}

.slide:nth-child(5) {
left:170px;
opacity:0.2;}

.slide:nth-child(n+6) {
left:255px;
opacity:0;}

.slide .details {
position:absolute;
left:0;
width:100%;
padding:25px;
display:flex;
flex-direction:column;
gap:10px;}

.details h1 {
position:relative;
width:30%;
left:-100%;
font-size:1.2rem;
line-height:25px;
opacity:0;
color:#fff;
text-shadow:0 2px 2px rgba(0,0,0,0.4);}

.details p {
position:relative;
left:-100%;
width:40%;
font-weight:300;
font-size:0.6rem;
line-height:15px;
opacity:0;
color:white;
text-shadow:0 1px 2px rgba(0,0,0,0.4);}

.details ul {
position:relative;
width:65%;
list-style:none;
display:flex;
align-items:center;
justify-content:start;
gap:10px;}

.details ul li {
position:relative;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
opacity:0;
transform:translateY(10px);}

.details ul li .icon {
position:relative;
display:flex;
align-items:center;
justify-content:center;
padding:6px;
border-radius:2px;
background:var(--background);
box-shadow:0 1px 2px var(--shadow);}

.details ul li span {
color:#fff;
font-weight:400;
font-size:0.4rem;
text-shadow:0 1px 2px rgba(0,0,0,0.8);}

.details ul li .icon img {
width:8px;
height:8px;}

.details .join {
position:relative;
display:flex;
gap:12px;
margin-top:5px;}

.details .button-container {
position:relative;
display:flex;
opacity:0;
transform:scale(0.7);}

.details button {
position:relative;
padding:6px 10px;
border:none;
background:none;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
border-radius:4px;
transition:0.3s;
color:#fff;
font-weight:500;
font-size:0.5rem;
background:var(--gradient);
box-shadow:0 4px 10px rgba(0,0,0,0.6);
text-shadow:0 2px 3px rgba(0,0,0,0.7);}

.details section {
position:relative;
display:flex;
gap:8px;
align-items:center;}

.details .profile-container {
position:relative;
display:flex;
justify-content:center;
align-items:center;}

.details .profile-container img {
position:relative;
width:22px;
height:22px;
object-fit:cover;
opacity:0;
border-radius:50%;
transform:scale(0.8);
border:1px solid var(--Background);
box-shadow:0 1px 2px rgba(0,0,0,1);}

.details .profile-container img:first-child {
margin-right:-5px;}

.details .profile-container img:last-child {
margin-left:-5px;}

.details .text-container {
position:relative;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;}

.details .text-container h2 {
color:#fff;
font-size:0.6rem;
font-weight:1000;
text-shadow:0 1px 2px rgba(0,0,0,0.8);}

.details .text-container span {
color:#A3A3A3;
font-size:0.4rem;
font-weight:300;
text-shadow:0 1px 2px rgba(0,0,0,0.8);}

.slide:nth-child(1) * {
transition:0s 0.5s;}

.slide:nth-child(2) h1 {
left:0;
opacity:1;
transition:0.5s 0.5s;}

.slide:nth-child(2) p {
left:0;
opacity:1;
transition:0.5s 0.7s;}

.slide:nth-child(2) .details ul li {
opacity:1;
transform:translateY(0);
transition:0.4s 1.2s;}

.slide:nth-child(2) .details ul li:nth-child(2) {
transition:0.4s 1.3s;}

.slide:nth-child(2) .details ul li:nth-child(3) {
transition:0.3s 1.4s;}

.slide:nth-child(2) .button-container {
opacity:1;
transform:scale(1);
transition:0.4s cubic-bezier(0,0,0.5,2) 1.8s;}

.slide:nth-child(2) .details section img {
opacity:1;
transform:scale(1);
transition:0.4s cubic-bezier(0,0,0.5,2) 2.5s;}

.slide:nth-child(2) .details section img:nth-child(2) {
transition:0.4s cubic-bezier(0,0,0.5,2) 2.6s;}

.slide:nth-child(2) .details section img:nth-child(3) {
transition:0.4s cubic-bezier(0,0,0.5,2) 2.7s;}

.slide:nth-child(2) .details section .text-container {
opacity:1;
transition:0.4s 3s;}

.arrows {
position:absolute;
top:112.5px;
width:345px;
height:45px;
display:none;
gap:255px;}

.arrows img {
position:relative;
width:45px;
height:45px;
border-radius:50%;
cursor:pointer;
object-fit:cover;
transition:0.3s;
background:rgba(0,0,0,0.2);
backdrop-filter:blur(10px);
box-shadow:0 3px 6px rgba(0,0,0,0.15);}

</style>

</head>

<body>

<!-- Hexagon Background -->
<div class="wrapper">

<section class="Layer"></section>

<svg viewBox="0 0 300 300">

<defs>

<linearGradient id="Grad-Stroke" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="var(--color1)"/>
<stop offset="100%" stop-color="var(--color2)"/>
</linearGradient>

<filter id="Stroke-Shadow" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="var(--color2)" flood-opacity="1"/>
</filter>

</defs>

</svg>


<!-- Image Slider -->

<div class="container">

<ul class="slider"></ul>

<section class="arrows">

<img class="left" src="Courses/left-arrow.svg">

<img class="right" src="Courses/right-arrow.svg">

</section>

</div>

</div>

<script src="JS/ImageSlider1.js"></script>

</body>

</html>
